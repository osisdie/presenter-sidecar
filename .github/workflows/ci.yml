name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile mirror.py panel_server.py presenter_sidecar/*.py tests/*.py scripts/media/*.py
      - name: Unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Panel JavaScript (syntax + step rule shared with Python)
        run: |
          node --version
          for f in web/*.js; do node --check "$f"; done
          node --test tests/js/*.test.js
      - name: Private-term scan
        env:
          # Optional repository secret: extra regexes, one per line.
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: scripts/check/scan-private.sh
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-windows.txt -r requirements-dev.txt
      - name: Import smoke test (no window is opened)
        run: |
          python -c "import mirror, panel_server; print('imports ok')"
          python mirror.py --selfcheck
      - name: Unit tests
        run: python -m pytest -q
