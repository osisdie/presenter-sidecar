<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>presenter-sidecar layout: laptop display with a private panel, projector with only the chosen window, remote viewers sharing display 2</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e9ecf1"/><rect width="4" height="10" fill="#d8dde5"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#f7f8fa"/>

  <!-- Laptop display -->
  <text x="40" y="52" font-size="22" font-weight="700" fill="#1f2430">Laptop display</text>
  <text x="40" y="76" font-size="15" fill="#5b6472">only you see this</text>
  <rect x="40" y="92" width="430" height="290" rx="10" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <!-- terminal (never projected) -->
  <rect x="58" y="270" width="150" height="96" rx="6" fill="url(#stripes)" stroke="#b8bfca"/>
  <text x="133" y="312" font-size="14" text-anchor="middle" fill="#5b6472">terminal, chat,</text>
  <text x="133" y="331" font-size="14" text-anchor="middle" fill="#5b6472">other windows</text>
  <text x="133" y="352" font-size="12" text-anchor="middle" fill="#8a93a2">never projected</text>
  <!-- chosen window -->
  <rect x="70" y="110" width="250" height="175" rx="6" fill="#f4f7f2" stroke="#2e7d32" stroke-width="3"/>
  <rect x="70" y="110" width="250" height="24" rx="6" fill="#2e7d32"/>
  <text x="80" y="127" font-size="13" fill="#ffffff">chosen window (F7)</text>
  <rect x="88" y="150" width="70" height="40" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="166" y="150" width="70" height="40" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="244" y="150" width="60" height="40" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="88" y="204" width="80" height="20" rx="5" fill="#2e7d32"/>
  <!-- private panel -->
  <rect x="345" y="100" width="115" height="274" rx="6" fill="#14171c"/>
  <text x="402" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#ffd600">Panel</text>
  <text x="402" y="148" font-size="12" text-anchor="middle" fill="#9aa3b2">private</text>
  <rect x="356" y="160" width="93" height="8" rx="4" fill="#272c35"/><rect x="356" y="160" width="55" height="8" rx="4" fill="#34c759"/>
  <text x="358" y="192" font-size="12" fill="#e9ecf1">notes follow</text>
  <text x="358" y="208" font-size="12" fill="#e9ecf1">the projected</text>
  <text x="358" y="224" font-size="12" fill="#e9ecf1">page</text>
  <text x="358" y="252" font-size="12" fill="#e9ecf1">section timers</text>
  <text x="358" y="280" font-size="12" fill="#e9ecf1">AI helper</text>
  <text x="358" y="296" font-size="11" fill="#9aa3b2">(optional)</text>

  <!-- arrow mirror -->
  <line x1="482" y1="200" x2="590" y2="200" stroke="#5b6472" stroke-width="3" marker-end="url(#arr)"/>
  <text x="536" y="186" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2430">mirror</text>
  <text x="536" y="224" font-size="12" text-anchor="middle" fill="#5b6472">WGC / PrintWindow</text>

  <!-- Projector -->
  <text x="600" y="52" font-size="22" font-weight="700" fill="#1f2430">Projector (display 2)</text>
  <text x="600" y="76" font-size="15" fill="#5b6472">the audience sees only this</text>
  <rect x="600" y="92" width="340" height="200" rx="10" fill="#000000"/>
  <rect x="632" y="100" width="276" height="184" fill="#f4f7f2"/>
  <rect x="632" y="100" width="276" height="22" fill="#2e7d32"/>
  <rect x="652" y="138" width="74" height="42" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="734" y="138" width="74" height="42" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="816" y="138" width="74" height="42" rx="5" fill="#ffffff" stroke="#dfe8dc"/>
  <rect x="652" y="196" width="86" height="22" rx="5" fill="#2e7d32"/>
  <!-- pointer ring + arrow -->
  <circle cx="712" cy="207" r="22" fill="#ffd600" fill-opacity="0.35" stroke="#ffd600" stroke-width="3"/>
  <circle cx="712" cy="207" r="30" fill="none" stroke="#ff3b30" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M712,207 l0,22 l5,-4.6 l3.6,8 l3.4,-1.5 l-3.4,-7.8 l6.4,-0.2 z" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="770" y="312" font-size="13" text-anchor="middle" fill="#5b6472">letterboxed · big pointer, spotlight, click ripples</text>
  <text x="770" y="332" font-size="13" text-anchor="middle" fill="#5b6472">popups of the chosen window are followed</text>

  <!-- arrow share -->
  <line x1="950" y1="200" x2="1010" y2="200" stroke="#5b6472" stroke-width="3" marker-end="url(#arr)"/>
  <text x="980" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">share</text>

  <!-- Remote viewers -->
  <text x="1018" y="52" font-size="22" font-weight="700" fill="#1f2430">Remote</text>
  <text x="1018" y="76" font-size="15" fill="#5b6472">Meet / Teams / Zoom</text>
  <rect x="1018" y="120" width="150" height="160" rx="10" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <rect x="1030" y="132" width="126" height="78" rx="4" fill="#f4f7f2" stroke="#2e7d32"/>
  <rect x="1030" y="132" width="126" height="12" fill="#2e7d32"/>
  <circle cx="1048" cy="236" r="11" fill="#c9ced8"/><circle cx="1076" cy="236" r="11" fill="#c9ced8"/>
  <circle cx="1104" cy="236" r="11" fill="#c9ced8"/><circle cx="1132" cy="236" r="11" fill="#c9ced8"/>
  <text x="1093" y="304" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">"entire screen</text>
  <text x="1093" y="322" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">→ display 2"</text>

  <!-- footer -->
  <text x="40" y="430" font-size="16" fill="#1f2430"><tspan font-weight="700">Hotkeys</tspan>  F7 pick · Shift+F7 bring back · F8 freeze · F9 blank · F10 ring/spotlight · Ctrl+Alt+PgDn/PgUp notes</text>
  <text x="40" y="460" font-size="14" fill="#5b6472">Panel server binds to 127.0.0.1 only. The panel, terminals and other windows never reach the projector or the call.</text>
</svg>
